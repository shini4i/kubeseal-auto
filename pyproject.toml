[project]
name = "kubeseal-auto"
version = "0.7.1"
description = "An interactive wrapper for kubeseal binary"
authors = [{ name = "Vadim Gedz", email = "github@shini4i.dev" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
    "requests>=2.28.1,<3",
    "kubernetes>=36.0.1",
    "click>=8.3.1,<9",
    "questionary>=2.0.1,<3",
    "rich>=14.0.0,<15",
]

[project.urls]
homepage = "https://github.com/shini4i/kubeseal-auto"
repository = "https://github.com/shini4i/kubeseal-auto"

[project.scripts]
kubeseal-auto = "kubeseal_auto.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.14.8,<0.15",
    "mypy>=1.13.0,<2",
    "types-PyYAML>=6.0,<7",
    "types-requests>=2.31,<3",
    "pexpect>=4.9,<5",
    "bandit>=1.9.4,<2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kubeseal_auto"
module-root = "src"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator - explicit if/else is clearer for Kubeseal init
    "SIM115", # context manager for temp file - NamedTemporaryFile is managed by class lifecycle
]

[tool.ruff.lint.isort]
known-first-party = ["kubeseal_auto"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "kubernetes.*",
    "questionary.*",
    "colorama.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring a live kind cluster",
]
